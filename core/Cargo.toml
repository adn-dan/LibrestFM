[package]
name = "librestfm-core"
version = "1.1.0"
description = "Import, fusion, statistiques et enrichissement des historiques d'écoute"
license = "GPL-3.0-or-later"
edition = "2024"

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
csv = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
unicode-normalization = "0.1"
sha2 = "0.10"
encoding_rs = "0.8"
thiserror = "2"
ureq = { version = "2", features = ["json"] }
urlencoding = "2"
regex = "1"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
